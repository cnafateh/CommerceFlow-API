name: Django CI

on:
  push:
    branches:
      - main
      - chore/github-actions-ci
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: commerce_db
          POSTGRES_USER: commerce_user
          POSTGRES_PASSWORD: commerce_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U commerce_user -d commerce_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      SECRET_KEY: django-insecure-ci-secret-key
      DEBUG: "False"
      DATABASE_URL: postgres://commerce_user:commerce_password@localhost:5432/commerce_db
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py migrate

      - name: Run system checks
        run: |
          python manage.py check

      - name: Run tests
        run: |
          pytest